name: Release

# Triggered by pushing a semver tag, e.g.:
#   git tag v2.1.0
#   git push origin v2.1.0

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # Re-run the essentials before publishing anything — a release is only
  # cut from a commit that actually builds.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so release notes can list every commit since the last tag

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DataHarvest ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
